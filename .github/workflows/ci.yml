name: BMI Enterprise Workshop CI & Security Gate

on:
  push:
    branches: [main, staging, portfolio-public]
  pull_request:
    branches: [main, staging]

jobs:
  quality-and-security-gate:
    name: Type-Check, Automated Tests, Build & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Static Type Check
        run: npm run lint

      - name: Run Automated Unit & Security Test Suite (28 Tests)
        run: npm test

      - name: Build Production Bundle (Code-Split Chunks)
        run: npm run build

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high
